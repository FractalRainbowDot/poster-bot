[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poster-bot"
version = "0.1.0"
description = "Single-owner Telegram channel posting bot: drafts, slots, safe sending."
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiogram==3.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.133.2",
]

[project.scripts]
poster-bot = "poster_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"